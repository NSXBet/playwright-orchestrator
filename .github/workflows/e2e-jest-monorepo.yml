name: E2E Jest Monorepo

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards
        required: false
        default: "2"
      level:
        description: Assignment granularity (file | test)
        required: false
        default: file
  pull_request:
    paths:
      - "packages/jest-orchestrator/**"
      - "examples/monorepo/**"
      - ".github/workflows/e2e-jest-monorepo.yml"
      - ".github/actions/jest-*/**"

jobs:
  setup:
    name: Package Jest orchestrator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun run build -- --filter=@nsxbet/jest-orchestrator

      - name: Create tarball
        working-directory: packages/jest-orchestrator
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator/*.tgz
          retention-days: 1

  orchestrate:
    name: Orchestrate Jest tests
    needs: setup
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator

      - name: Install CLI from tarball
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g ./packages/jest-orchestrator/nsxbet-jest-orchestrator-*.tgz
          "$HOME/.npm-global/bin/jest-orchestrator" --version

      - name: Install monorepo dependencies
        working-directory: examples/monorepo/apps/web
        run: npm install

      - name: Generate shard matrix
        id: matrix
        run: |
          SHARDS="${{ github.event.inputs.shards || '2' }}"
          MATRIX=$(seq 1 "$SHARDS" | jq -R . | jq -sc '{shard: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Orchestrate tests
        id: orchestrate
        uses: ./.github/actions/jest-orchestrate
        with:
          root: examples/monorepo/apps/web
          timing-file: jest-monorepo-timing.json
          shards: ${{ github.event.inputs.shards || '2' }}
          level: ${{ github.event.inputs.level || 'file' }}

      - name: Validate cold-start assignment
        run: |
          set -euo pipefail
          ASSIGNMENT=.orchestration/assignment.json
          MANIFEST=.orchestration/manifest.json
          DISCOVERED=$(jq '.tests | length' "$MANIFEST")
          ASSIGNED=$(jq '[.shards[].testIds[]] | length' "$ASSIGNMENT")
          PLANNED_DURATION=$(jq '[.shards[].expectedDuration] | add' "$ASSIGNMENT")
          EXPECTED_DURATION=$((DISCOVERED * 10000))

          [ "$DISCOVERED" -eq "$ASSIGNED" ] || {
            echo "::error::cold-start plan assigned $ASSIGNED of $DISCOVERED discovered tests"
            exit 1
          }
          [ "$PLANNED_DURATION" -eq "$EXPECTED_DURATION" ] || {
            echo "::error::cold-start plan is $PLANNED_DURATION ms; expected $EXPECTED_DURATION ms"
            exit 1
          }
          jq -e '.shards | all(.expectedDuration > 0)' "$ASSIGNMENT" > /dev/null || {
            echo "::error::a cold-start shard has a zero expected duration"
            exit 1
          }
          echo "✓ Cold-start plan: $ASSIGNED/$DISCOVERED tests, $PLANNED_DURATION ms estimated"

      - name: Upload assignment artifact
        uses: actions/upload-artifact@v4
        with:
          name: jest-orchestration-assignment
          path: .orchestration/
          retention-days: 1
          include-hidden-files: true

  test:
    name: Jest shard ${{ matrix.shard }}
    needs: [setup, orchestrate]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.orchestrate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator

      - name: Install CLI from tarball
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g ./packages/jest-orchestrator/nsxbet-jest-orchestrator-*.tgz

      - name: Install monorepo dependencies
        working-directory: examples/monorepo/apps/web
        run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: jest-orchestration-assignment
          path: .orchestration

      - name: Get shard assignment
        id: shard
        uses: ./.github/actions/jest-get-shard
        with:
          assignment-file: .orchestration/assignment.json
          shard-index: ${{ matrix.shard }}

      - name: Run Jest tests for this shard
        id: run
        working-directory: examples/monorepo/apps/web
        run: |
          set +e
          jest-orchestrator run-shard \
            --root . \
            --assignment "${{ github.workspace }}/.orchestration/assignment.json" \
            --shard ${{ matrix.shard }} \
            --output shard-timing-${{ matrix.shard }}.json \
            --report-output report-shard-${{ matrix.shard }}.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "::error::shard ${{ matrix.shard }} verification failed (exit $EXIT_CODE)"
            exit "$EXIT_CODE"
          fi
          echo "Jest completed with exit $EXIT_CODE; intentional test failures are expected in this fixture."

      - name: Annotate failures
        if: success() || failure()
        working-directory: examples/monorepo/apps/web
        run: |
          REPORT="report-shard-${{ matrix.shard }}.json"
          if [ -f "$REPORT" ]; then
            ANNOTATION=$(jest-orchestrator annotate --report "$REPORT" --assignment "${{ github.workspace }}/.orchestration/assignment.json" --shard ${{ matrix.shard }} --summary-append "$GITHUB_STEP_SUMMARY")
            echo "$ANNOTATION"
            ! grep -Fq "not selected" <<< "$ANNOTATION" || {
              echo "::error::assigned Jest tests must not be reported as outside this shard"
              exit 1
            }
          fi

      - name: Upload timing artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-timing-shard-${{ matrix.shard }}
          path: examples/monorepo/apps/web/shard-timing-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload JSON report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-shard-${{ matrix.shard }}
          path: examples/monorepo/apps/web/report-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge-reports:
    name: Validate Jest reports
    needs: [setup, orchestrate, test]
    if: success() || failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-orchestration-assignment
          path: .orchestration

      - uses: actions/download-artifact@v4
        with:
          pattern: jest-report-shard-*
          merge-multiple: true
          path: reports

      - name: Validate exact cross-shard coverage
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync } from "node:fs";

          const assignment = JSON.parse(readFileSync(".orchestration/assignment.json"));
          const selectedByShard = new Map(
            assignment.shards.map((shard) => [
              String(shard.shard),
              shard.testIds.map((key) => {
                const [, file, fullName] = JSON.parse(
                  Buffer.from(key, "base64url").toString(),
                );
                return JSON.stringify([file, fullName]);
              }),
            ]),
          );
          const executedShardsByIdentity = new Map();
          let selected = 0;
          let observed = 0;

          for (const file of readdirSync("reports").filter((name) => name.startsWith("report-shard-"))) {
            const shard = file.match(/report-shard-(\d+)\.json$/)?.[1];
            if (!shard || !selectedByShard.has(shard)) throw new Error(`unknown report artifact: ${file}`);
            const expected = selectedByShard.get(shard);
            const remaining = new Map();
            for (const identity of expected) remaining.set(identity, (remaining.get(identity) ?? 0) + 1);
            selected += expected.length;

            const report = JSON.parse(readFileSync(`reports/${file}`));
            for (const suite of report.testResults) {
              for (const assertion of suite.assertionResults) {
                const identity = JSON.stringify([suite.name, assertion.fullName]);
                if (["passed", "failed"].includes(assertion.status)) {
                  if (!remaining.has(identity)) throw new Error(`shard ${shard} executed an unassigned test: ${identity}`);
                  const shards = executedShardsByIdentity.get(identity) ?? new Set();
                  shards.add(shard);
                  executedShardsByIdentity.set(identity, shards);
                }
                const count = remaining.get(identity) ?? 0;
                if (count > 0) {
                  remaining.set(identity, count - 1);
                  observed++;
                }
              }
            }
            const missing = [...remaining.values()].reduce((sum, count) => sum + count, 0);
            if (missing > 0) throw new Error(`shard ${shard} did not report ${missing} assigned test occurrence(s)`);
          }

          const duplicates = [...executedShardsByIdentity.values()].filter((shards) => shards.size > 1).length;
          if (duplicates > 0) throw new Error(`${duplicates} test identity(ies) executed in more than one shard`);
          if (selected !== observed) throw new Error(`assigned ${selected} but observed ${observed} selected test occurrences`);
          console.log(`Exact shard coverage validated: ${selected} assigned and observed; ${duplicates} cross-shard duplicates.`);
          EOF

  merge:
    name: Merge Jest timings
    needs: [setup, orchestrate, test, merge-reports]
    if: success() || failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator

      - name: Install CLI from tarball
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g ./packages/jest-orchestrator/nsxbet-jest-orchestrator-*.tgz

      - uses: actions/download-artifact@v4
        with:
          name: jest-orchestration-assignment
          path: .orchestration

      - uses: actions/download-artifact@v4
        with:
          pattern: jest-timing-shard-*
          merge-multiple: true
          path: timing-artifacts

      - name: Merge timing data
        uses: ./.github/actions/jest-merge-timing
        with:
          new-files: timing-artifacts/shard-timing-*.json
          output-file: jest-monorepo-timing.json
          manifest: .orchestration/manifest.json

      - name: Validate timing round trip
        run: |
          set -euo pipefail
          ENTRIES=$(jq '[.projects[].files[]] | length' jest-monorepo-timing.json)
          [ "$ENTRIES" -gt 0 ] || { echo "::error::no timing data was merged"; exit 1; }
          jest-orchestrator assign \
            --manifest .orchestration/manifest.json \
            --timings jest-monorepo-timing.json \
            --shards "${{ github.event.inputs.shards || '2' }}" \
            --level "${{ github.event.inputs.level || 'file' }}" \
            --output roundtrip-assignment.json
          TOTAL=$(jq '.totalTests' roundtrip-assignment.json)
          WARM_DURATION=$(jq '[.shards[].expectedDuration] | add' roundtrip-assignment.json)
          [ "$TOTAL" -eq 50 ] || { echo "::error::warm-start plan has $TOTAL tests; expected 50"; exit 1; }
          [ "$WARM_DURATION" -gt 0 ] || { echo "::error::warm-start plan has zero expected duration"; exit 1; }
          echo "✓ Timing round trip validated: $ENTRIES timing entries for $TOTAL discovered tests, $WARM_DURATION ms estimated"

      - name: Stage warm-start inputs
        run: |
          mkdir warm-start-inputs
          cp .orchestration/manifest.json warm-start-inputs/manifest.json
          cp roundtrip-assignment.json warm-start-inputs/assignment.json
          cp jest-monorepo-timing.json warm-start-inputs/timing.json

      - name: Upload warm-start inputs
        uses: actions/upload-artifact@v4
        with:
          name: jest-warm-start-inputs
          path: warm-start-inputs/
          retention-days: 1

  warm-test:
    name: Jest warm-start shard ${{ matrix.shard }}
    needs: [setup, orchestrate, merge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.orchestrate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator

      - name: Install CLI from tarball
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g ./packages/jest-orchestrator/nsxbet-jest-orchestrator-*.tgz

      - name: Install monorepo dependencies
        working-directory: examples/monorepo/apps/web
        run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: jest-warm-start-inputs
          path: warm-start-inputs

      - name: Run warm-start Jest shard
        working-directory: examples/monorepo/apps/web
        run: |
          set +e
          jest-orchestrator run-shard \
            --root . \
            --assignment "${{ github.workspace }}/warm-start-inputs/assignment.json" \
            --shard ${{ matrix.shard }} \
            --output warm-timing-${{ matrix.shard }}.json \
            --report-output warm-report-${{ matrix.shard }}.json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "::error::warm-start shard ${{ matrix.shard }} verification failed (exit $EXIT_CODE)"
            exit "$EXIT_CODE"
          fi

      - name: Upload warm-start timing artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-warm-timing-shard-${{ matrix.shard }}
          path: examples/monorepo/apps/web/warm-timing-${{ matrix.shard }}.json
          if-no-files-found: error

  verify-warm-start:
    name: Verify Jest warm start
    needs: [orchestrate, merge, warm-test]
    if: success() || failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jest-package-tarball
          path: packages/jest-orchestrator

      - name: Install CLI from tarball
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g ./packages/jest-orchestrator/nsxbet-jest-orchestrator-*.tgz

      - uses: actions/download-artifact@v4
        with:
          name: jest-orchestration-assignment
          path: cold-assignment

      - uses: actions/download-artifact@v4
        with:
          name: jest-warm-start-inputs
          path: warm-start-inputs

      - uses: actions/download-artifact@v4
        with:
          pattern: jest-timing-shard-*
          merge-multiple: true
          path: timing-artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: jest-warm-timing-shard-*
          merge-multiple: true
          path: warm-timing-artifacts

      - name: Validate warm-start execution and collect metrics
        run: |
          set -euo pipefail
          ASSIGNMENT=warm-start-inputs/assignment.json
          EXPECTED=$(jq '[.shards[].testIds[]] | length' "$ASSIGNMENT")
          OBSERVED=$(jq '[.measurements[]] | length' warm-timing-artifacts/warm-timing-*.json | awk '{ total += $1 } END { print total }')
          PLANNED_DURATION=$(jq '[.shards[].expectedDuration] | add' "$ASSIGNMENT")
          MEASURED_DURATION=$(jq '[.measurements[].duration] | add' warm-timing-artifacts/warm-timing-*.json | awk '{ total += $1 } END { print total }')

          [ "$EXPECTED" -eq 50 ] || { echo "::error::warm-start plan assigned $EXPECTED tests; expected 50"; exit 1; }
          [ "$OBSERVED" -eq 48 ] || { echo "::error::warm-start execution measured $OBSERVED tests; expected 48 executable tests"; exit 1; }
          [ "$PLANNED_DURATION" -gt 0 ] || { echo "::error::warm-start plan has zero expected duration"; exit 1; }
          [ "$MEASURED_DURATION" -gt 0 ] || { echo "::error::warm-start execution collected zero duration"; exit 1; }
          echo "✓ Warm-start execution: $EXPECTED assigned tests, $OBSERVED measurements, $PLANNED_DURATION ms planned, $MEASURED_DURATION ms measured"

      - name: Merge second-run timings
        uses: ./.github/actions/jest-merge-timing
        with:
          existing-file: warm-start-inputs/timing.json
          new-files: warm-timing-artifacts/warm-timing-*.json
          output-file: warm-jest-monorepo-timing.json
          manifest: warm-start-inputs/manifest.json

      - name: Validate timing learning
        run: |
          set -euo pipefail
          FIRST=$(jq '[.projects[].files[]] | length' warm-start-inputs/timing.json)
          SECOND=$(jq '[.projects[].files[]] | length' warm-jest-monorepo-timing.json)
          REPEATED=$(jq '[.projects[].files[] | select(.runs >= 2)] | length' warm-jest-monorepo-timing.json)
          [ "$FIRST" -eq 47 ] || { echo "::error::first run produced $FIRST timing entries; expected 47"; exit 1; }
          [ "$SECOND" -eq "$FIRST" ] || { echo "::error::second run changed timing entry count from $FIRST to $SECOND"; exit 1; }
          [ "$REPEATED" -eq "$FIRST" ] || { echo "::error::second run updated $REPEATED of $FIRST timing entries"; exit 1; }
          echo "✓ Timing learning: $SECOND entries updated by a real second shard execution"

      - name: Write cold-to-warm lifecycle verdict
        run: |
          set -euo pipefail
          COLD=cold-assignment/assignment.json
          WARM=warm-start-inputs/assignment.json
          MANIFEST=warm-start-inputs/manifest.json
          DISCOVERED=$(jq '.tests | length' "$MANIFEST")
          STATIC=$(jq '[.tests[] | select(.fullName | test("Skip Patterns (this test is skipped|implement this test later)$"))] | length' "$MANIFEST")
          COLD_ASSIGNED=$(jq '[.shards[].testIds[]] | length' "$COLD")
          WARM_ASSIGNED=$(jq '[.shards[].testIds[]] | length' "$WARM")
          COLD_PLANNED=$(jq '[.shards[].expectedDuration] | add' "$COLD")
          WARM_PLANNED=$(jq '[.shards[].expectedDuration] | add' "$WARM")
          COLD_MEASURED=$(jq '[.measurements[]] | length' timing-artifacts/shard-timing-*.json | awk '{ total += $1 } END { print total }')
          WARM_MEASURED=$(jq '[.measurements[]] | length' warm-timing-artifacts/warm-timing-*.json | awk '{ total += $1 } END { print total }')
          FIRST=$(jq '[.projects[].files[]] | length' warm-start-inputs/timing.json)
          REPEATED=$(jq '[.projects[].files[] | select(.runs >= 2)] | length' warm-jest-monorepo-timing.json)
          PLACEMENT_CHANGED=$(jq -n --slurpfile cold "$COLD" --slurpfile warm "$WARM" '$cold[0].shards != $warm[0].shards')
          {
            echo "## Jest cold-to-warm lifecycle verdict"
            echo ""
            echo "### 1. Run configuration"
            echo "- Framework: Jest"
            echo "- Assignment level: ${{ github.event.inputs.level || 'file' }}"
            echo "- Shards: ${{ github.event.inputs.shards || '2' }} (five-shard manual coverage supported)"
            echo "- Cold timing-store source: absent; warm input: \`warm-start-inputs/timing.json\`"
            echo ""
            echo "### 2. Cold plan"
            echo "- Discovered occurrences: $DISCOVERED"
            echo "- Assigned occurrences: $COLD_ASSIGNED"
            echo "- Static skip/todo occurrences: $STATIC"
            echo "- Total planned duration: $COLD_PLANNED ms (10-second fallback estimates)"
            echo "| Cold shard | Files | Tests | Expected duration |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.shards[] | "| \(.shard) | \(.files | length) | \(.testIds | length) | \(.expectedDuration) ms |"' "$COLD"
            echo ""
            echo "### 3. Cold execution and collection"
            echo "- Exact assignment/report coverage: $COLD_ASSIGNED/$COLD_ASSIGNED"
            echo "- Executable measurements: $COLD_MEASURED"
            echo "- Merged timing entries: $FIRST"
            echo ""
            echo "### 4. Timing hand-off"
            echo "- Exact store passed to warm assignment: \`warm-start-inputs/timing.json\`"
            echo "- Timing entries available to warm plan: $FIRST"
            echo ""
            echo "### 5. Warm plan"
            echo "- Assigned occurrences: $WARM_ASSIGNED (cold: $COLD_ASSIGNED)"
            echo "- Total planned duration: $WARM_PLANNED ms (cold: $COLD_PLANNED ms)"
            echo "| Warm shard | Files | Tests | Expected duration |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.shards[] | "| \(.shard) | \(.files | length) | \(.testIds | length) | \(.expectedDuration) ms |"' "$WARM"
            echo "- Placement changed: $PLACEMENT_CHANGED (diagnostic only; wall-clock timing is not required to move a shard)"
            echo ""
            echo "### 6. Warm execution and second merge"
            echo "- Exact assignment/report coverage: $WARM_ASSIGNED/$WARM_ASSIGNED"
            echo "- Executable measurements: $WARM_MEASURED"
            echo "- Repeated observations: $REPEATED/$FIRST"
            echo ""
            echo "### 7. Final verdict"
            echo "| Invariant | Expected | Actual | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| Cold assignment coverage | $DISCOVERED | $COLD_ASSIGNED | PASS |"
            echo "| Cold store passed to warm plan | non-empty | $FIRST entries | PASS |"
            echo "| Warm assignment coverage | $DISCOVERED | $WARM_ASSIGNED | PASS |"
            echo "| Second-run observations | $FIRST | $REPEATED | PASS |"
          } >> "$GITHUB_STEP_SUMMARY"
