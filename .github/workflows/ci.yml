name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            bun run lint -- --filter="...[origin/${BASE_REF}...HEAD]"
          else
            bun run lint
          fi

      - name: Typecheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            bun run typecheck -- --filter="...[origin/${BASE_REF}...HEAD]"
          else
            bun run typecheck
          fi

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            bunx turbo run test --filter="...[origin/${BASE_REF}...HEAD]"
          else
            bun run test
          fi

  build:
    name: Build
    runs-on: ubuntu-24.04
    outputs:
      publish-matrix: ${{ steps.affected.outputs.publish-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Detect publishable affected packages
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'publish-matrix={"include":[{"package":"playwright-orchestrator","bin":"playwright-orchestrator"},{"package":"jest-orchestrator","bin":"jest-orchestrator"}]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          FILTER="...[origin/${BASE_REF}...HEAD]"
          bunx turbo run build --filter="$FILTER" --dry-run=json > affected.json
          MATRIX=$(jq -c '{include: [.tasks[] | select(.command != "<NONEXISTENT>") | select(.taskId == "@nsxbet/playwright-orchestrator#build" or .taskId == "@nsxbet/jest-orchestrator#build") | .taskId | sub("^@nsxbet/"; "") | sub("#build$"; "") | {package: ., bin: .}] | unique_by(.package) | map(if .package == "playwright-orchestrator" then .bin = "playwright-orchestrator" else .bin = "jest-orchestrator" end)}' affected.json)
          echo "publish-matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            bun run build -- --filter="...[origin/${BASE_REF}...HEAD]"
          else
            bun run build
          fi

  test-publish:
    name: Test Publish (${{ matrix.package }})
    runs-on: ubuntu-24.04
    needs: [build]
    if: needs.build.outputs.publish-matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.publish-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun run build -- --filter=@nsxbet/${{ matrix.package }}

      - name: Start Verdaccio
        run: |
          bun install -g verdaccio
          mkdir -p verdaccio/storage
          verdaccio --config verdaccio/config.yaml &
          sleep 5

          AUTH_TOKEN=$(echo -n 'test:test' | base64)
          echo "registry=http://localhost:4873/" > ~/.npmrc
          echo "//localhost:4873/:_auth=$AUTH_TOKEN" >> ~/.npmrc
          echo "//localhost:4873/:always-auth=true" >> ~/.npmrc

      - name: Publish to Verdaccio
        working-directory: packages/${{ matrix.package }}
        run: |
          npm pkg set version=0.0.0-test.${{ github.run_id }}
          npm pkg delete publishConfig
          npm publish --tag test --registry http://localhost:4873
          git checkout package.json

      - name: Verify install from Verdaccio
        run: |
          mkdir -p /tmp/test-install && cd /tmp/test-install
          npm init -y
          npm install @nsxbet/${{ matrix.package }}@0.0.0-test.${{ github.run_id }} --registry http://localhost:4873
          npx ${{ matrix.bin }} --version
